<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Video</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
        }

        .video-container {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            iframe {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <h1>My Google Drive Video</h1>

    <div class="video-container">

        <iframe
            src="https://drive.google.com/file/d/1nvDrVeEWP-pJs1GHnW9cx3jN0g6TeYpz/preview"
            allow="autoplay; fullscreen">
        </iframe>

    </div>

</body>

</html>
